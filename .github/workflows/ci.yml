name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Check whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "$(git merge-base HEAD "origin/${{ github.base_ref }}")"..HEAD
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          else
            git diff --check "$(git merge-base HEAD origin/main)"..HEAD
          fi

      - name: Verify OpenGraph image asset
        run: |
          test -f public/opengraph-image.png
          git ls-tree -r HEAD -- public/opengraph-image.png

      - name: Install npm dependencies
        run: npm ci

      - name: Audit production npm dependencies
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit production pnpm dependencies
        run: pnpm audit --prod
